# Production: the app shares a small server with another service, so both
# containers get a low CPU weight and hard memory limits, and nothing is
# published to the internet from here. A reverse proxy in front adds HTTPS.
name: stt

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stt
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: stt
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    cpu_shares: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stt"]
      interval: 5s
      retries: 20
    logging: *logging

  app:
    image: stt-app:${TAG:?set TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql+asyncpg://stt:${DB_PASSWORD}@db:5432/stt
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WHISPER_THREADS: ${WHISPER_THREADS:-1}
      MAX_SESSIONS: ${MAX_SESSIONS:-2}
      MAX_SESSION_SECONDS: ${MAX_SESSION_SECONDS:-180}
    mem_limit: 1g
    cpus: ${APP_CPUS:-0.85}
    cpu_shares: 128
    ports:
      - "127.0.0.1:${PORT:-8010}:8000"
    logging: *logging

volumes:
  pgdata:
